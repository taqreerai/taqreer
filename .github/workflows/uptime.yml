name: Uptime monitor

# External health check for https://taqreer.ai/api/status. That route is
# origin-dependent (returns 522 / times out when the Hetzner box is
# unreachable), and this runs on a GitHub-hosted runner OUTSIDE Hetzner +
# Cloudflare, so it catches a full origin outage the way a real user would,
# the exact failure we hit when nbg1's network leaf faulted.
#
# On a confirmed failure it opens a (de-duplicated) GitHub issue AND emails
# dev@taqreer.ai via Resend; the issue auto-closes and a recovery email is sent
# when the site comes back. Exactly one down email + one recovery email per
# incident (tied to the issue open/close), never every 5 minutes.
#
# Requires repo secret RESEND_API_KEY (same key the app uses; from address must
# be on the verified taqreer.ai domain).
#
# Caveat: GitHub's scheduled runner can be delayed several minutes under load and
# is itself unavailable during a GitHub incident, so for tight / phone alerting
# pair this with a hosted monitor (UptimeRobot, Better Stack).

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (GitHub's minimum)
  workflow_dispatch: {}

concurrency:
  group: uptime
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    # A hung gh/Resend call must not hold the `uptime` concurrency group
    # (cancel-in-progress: false) and queue every later scheduled probe.
    timeout-minutes: 5
    env:
      URL: https://taqreer.ai/api/status
      LABEL: uptime-down
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Email alerts via Resend (same provider the app uses). RESEND_API_KEY is
      # a repo secret; the from address must be on the verified taqreer.ai domain.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_FROM: "taqreer.ai uptime <share@taqreer.ai>"
      ALERT_TO: dev@taqreer.ai
    steps:
      - name: Probe the endpoint (3 attempts before declaring down)
        id: probe
        run: |
          code=000
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$URL" || echo 000)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && break
            [ "$i" -lt 3 ] && sleep 15
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "status=up" >> "$GITHUB_OUTPUT"
          else
            echo "status=down" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure incident label exists
        if: steps.probe.outputs.status == 'down'
        run: gh label create "$LABEL" --color B60205 --description "Open while the uptime check is failing" --force --repo "$GITHUB_REPOSITORY" || true

      - name: Open incident + ping (on failure, de-duplicated)
        if: steps.probe.outputs.status == 'down'
        env:
          CODE: ${{ steps.probe.outputs.code }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$LABEL" --json number --jq '.[0].number')
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          if [ -n "$existing" ]; then
            echo "Incident issue #$existing already open; not duplicating."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🔴 taqreer.ai is DOWN" \
            --label "$LABEL" \
            --body "Automated uptime check failed at $ts. Last HTTP code from \`$URL\`: **$CODE** (200 expected). This issue auto-closes when the site recovers."
          if [ -n "$RESEND_API_KEY" ]; then
            jq -n --arg from "$ALERT_FROM" --arg to "$ALERT_TO" \
              --arg subject "🔴 taqreer.ai is DOWN" \
              --arg text "Uptime check failed at $ts. $URL returned $CODE (200 expected). Checked externally from GitHub Actions; a GitHub issue was opened and auto-closes on recovery." \
              '{from:$from,to:[$to],subject:$subject,text:$text}' \
              | curl -sS --fail --max-time 15 -X POST https://api.resend.com/emails \
                  -H "Authorization: Bearer $RESEND_API_KEY" \
                  -H "Content-Type: application/json" -d @- >/dev/null \
              || echo "::warning::Resend down-alert email failed to send"
          fi

      - name: Close incident on recovery
        if: steps.probe.outputs.status == 'up'
        run: |
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$LABEL" --json number --jq '.[].number'); do
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "✅ Recovered at $ts — \`$URL\` returned 200. Auto-closing."
            gh issue close "$n" --repo "$GITHUB_REPOSITORY"
            if [ -n "$RESEND_API_KEY" ]; then
              jq -n --arg from "$ALERT_FROM" --arg to "$ALERT_TO" \
                --arg subject "✅ taqreer.ai recovered" \
                --arg text "$URL is back to 200 as of $ts. The incident issue was auto-closed." \
                '{from:$from,to:[$to],subject:$subject,text:$text}' \
                | curl -sS --fail --max-time 15 -X POST https://api.resend.com/emails \
                    -H "Authorization: Bearer $RESEND_API_KEY" \
                    -H "Content-Type: application/json" -d @- >/dev/null \
                || echo "::warning::Resend recovery email failed to send"
            fi
          done
