services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: taqreer
      POSTGRES_USER: taqreer_user
      POSTGRES_PASSWORD: taqreer2025secure
    ports:
      - "5432:5432"
    volumes:
      - taqreer_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  taqreer_postgres:
