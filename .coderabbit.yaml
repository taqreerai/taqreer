language: "ar"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    base_branches:
      - "main"
    drafts: false

path_instructions:
  - path: "app/**"
    instructions: |
      This is a Next.js 16 App Router project. RTL-first, Arabic UI.
      Always use Tailwind utility classes — no raw CSS in inline styles.
      Use globals.css semantic classes: card-dark, btn-gradient, btn-outline-dark, plan-banner, nav-active, etc.
      All app pages must use the page-container class.

  - path: "components/**"
    instructions: |
      RTL-first React components. Cairo font for Arabic, Poppins for English.
      No hardcoded colors — use design tokens from globals.css.
      No manual slide editing logic — Claude handles all design.

  - path: "lib/schema/**"
    instructions: |
      Zod schemas are the single source of truth for slide JSON structure.
      Never allow properties outside the Taqreer design vocabulary.
      Every element must have a stable ID field.
      Validate all Claude output through these schemas before writing to DB.

  - path: "inngest/**"
    instructions: |
      All AI generation, area redesign, export, and template jobs run here.
      Jobs must handle retries, partial failures, and status tracking.
      Never write Claude output to the DB without Zod validation first.
      Job status lifecycle: queued → running → completed or failed → retryable.

  - path: "scripts/**"
    instructions: |
      Utility scripts for setup and migrations. Not part of the app bundle.

chat:
  auto_reply: true
